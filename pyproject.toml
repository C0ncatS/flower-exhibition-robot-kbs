[project]
name = "flower-robot"
version = "0.1.0"
description = "Flower exhibition robot knowledge-based system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "experta>=1.9.4",
    "ipykernel>=7.2.0",
    "pyvis>=0.3.2",
]

[project.scripts]
flower-robot = "flower_robot.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
